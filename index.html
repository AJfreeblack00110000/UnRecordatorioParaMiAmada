<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>¿Quieres ser mi San Valentín? 💖</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      font-family: 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #fad0c4 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      transition: background 2s;
      position: relative;
    }

    .hearts-bg {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .heart {
      position: absolute;
      font-size: 1.8rem;
      color: rgba(255, 105, 180, 0.7);
      animation: float linear infinite;
      user-select: none;
    }

    @keyframes float {
      0% { transform: translateY(100vh) rotate(0deg); opacity: 0.6; }
      100% { transform: translateY(-20vh) rotate(360deg); opacity: 0; }
    }

    .card {
      background: rgba(255, 255, 255, 0.95);
      padding: 50px 70px;
      border-radius: 25px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.25);
      text-align: center;
      max-width: 550px;
      z-index: 10;
      position: relative;
      backdrop-filter: blur(8px);
    }

    h1 {
      color: #e91e63;
      font-size: 3.5em;
      margin: 0 0 15px;
    }

    .question {
      font-size: 1.6em;
      color: #444;
      margin: 25px 0 50px;
    }

    .buttons {
      display: flex;
      justify-content: center;
      gap: 80px;
      position: relative;
      min-height: 100px;
    }

    button {
      font-size: 1.4em;
      padding: 18px 50px;
      border: none;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.4s ease;
      font-weight: bold;
    }

    #yesBtn {
      background: #e91e63;
      color: white;
      box-shadow: 0 5px 15px rgba(233, 30, 99, 0.4);
    }

    #noBtn {
      background: #78909c;
      color: white;
      position: relative;
    }

    #yesBtn:hover {
      transform: scale(1.1);
      background: #c2185b;
    }

    .confetti {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
      z-index: 20;
      display: none;
    }

    .hidden {
      display: none !important;
    }

    #win {
      position: fixed;
      inset: 0;
      background: linear-gradient(135deg, #ff6b6b, #ff8e53);
      color: white;
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-size: 5em;
      z-index: 100;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%,100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
  </style>
</head>
<body>

  <div class="hearts-bg" id="heartsContainer"></div>

  <div class="card" id="card">
    <h1>💕 Te quiero mucho</h1>
    <div class="question">¿Quieres ser mi San Valentín?</div>

    <div class="buttons">
      <button id="yesBtn">SÍ 😍💖</button>
      <button id="noBtn">No... 😔</button>
    </div>
  </div>

  <div id="win">
    <div>¡SÍIIIIII! 🥰💘</div>
    <div style="font-size:0.6em; margin-top:30px;">Eres lo mejor que me ha pasado 💕</div>
  </div>

  <canvas id="confetti" class="confetti"></canvas>

  <script>
    // Corazones flotando
    function createHeart() {
      const heart = document.createElement('div');
      heart.className = 'heart';
      heart.innerHTML = ['❤️','💖','💕','💗','💞'][Math.floor(Math.random()*5)];
      heart.style.left = Math.random() * 100 + 'vw';
      heart.style.animationDuration = (Math.random() * 8 + 8) + 's';
      heart.style.animationDelay = Math.random() * 5 + 's';
      document.getElementById('heartsContainer').appendChild(heart);
      
      setTimeout(() => heart.remove(), 15000);
    }

    setInterval(createHeart, 400);

    // Lógica de botones
    const yesBtn = document.getElementById('yesBtn');
    const noBtn = document.getElementById('noBtn');
    const card = document.getElementById('card');
    const win = document.getElementById('win');

    let yesScale = 1;

    noBtn.addEventListener('click', () => {
      yesScale += 0.6;
      yesBtn.style.transform = `scale(${yesScale})`;
      yesBtn.style.padding = `${18 + yesScale*20}px ${50 + yesScale*30}px`;
      yesBtn.style.fontSize = `${1.4 + yesScale*0.5}em`;

      // Mover el botón No de forma caótica
      const x = (Math.random() - 0.5) * 600;
      const y = (Math.random() - 0.5) * 400;
      noBtn.style.transform = `translate(${x}px, ${y}px) rotate(${Math.random()*40 - 20}deg)`;
      noBtn.style.transition = 'transform 0.6s ease-out';

      // Después de muchos clics, hacerlo casi imposible
      if (yesScale > 5) {
        noBtn.style.opacity = '0.3';
        noBtn.style.pointerEvents = 'none';
      }
    });

    yesBtn.addEventListener('click', () => {
      card.classList.add('hidden');
      win.style.display = 'flex';
      
      // Lanzar confeti
      launchConfetti();
      
      // Cambiar fondo
      document.body.style.background = 'linear-gradient(135deg, #ff1744, #f50057)';
    });

    // Confeti simple (usando canvas)
    function launchConfetti() {
      const canvas = document.getElementById('confetti');
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      const ctx = canvas.getContext('2d');
      canvas.style.display = 'block';

      const pieces = [];
      const colors = ['#ff1744', '#f50057', '#d500f9', '#ff9100', '#ffd600', '#00e5ff'];

      for (let i = 0; i < 200; i++) {
        pieces.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height - canvas.height,
          size: Math.random() * 8 + 4,
          speed: Math.random() * 5 + 3,
          color: colors[Math.floor(Math.random() * colors.length)],
          rotation: Math.random() * 360,
          rotSpeed: Math.random() * 10 - 5
        });
      }

      function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        pieces.forEach(p => {
          p.y += p.speed;
          p.rotation += p.rotSpeed;
          ctx.fillStyle = p.color;
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate(p.rotation * Math.PI / 180);
          ctx.fillRect(-p.size/2, -p.size/2, p.size, p.size);
          ctx.restore();
          if (p.y > canvas.height) p.y = -20;
        });
        requestAnimationFrame(animate);
      }
      animate();

      setTimeout(() => canvas.style.display = 'none', 8000);
    }
  </script>

</body>
</html>
