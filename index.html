  <main>
    <h1>Bienvenida, mi amor 💖</h1>
    <p class="frase-diaria">Frase del día: <span id="frase"></span></p>
  </main>

  <script>
    const frases = [
      "Eres la luz de mi vida cada amanecer.",
      "Contigo, cada momento es eterno.",
      "Tu sonrisa ilumina mis días.",
      "Te amo más que ayer, pero menos que mañana.",
      "Eres mi refugio en la tormenta.",
      "Juntos, somos invencibles.",
      "Tu amor me hace volar.",
      // Agrega más frases aquí (una por día del año si quieres)
    ];

    const hoy = new Date();
    const diaDelAño = Math.floor((hoy - new Date(hoy.getFullYear(), 0, 0)) / 86400000);
    const fraseHoy = frases[diaDelAño % frases.length];
    document.getElementById('frase').textContent = fraseHoy;
  </script>
