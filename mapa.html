  <main>
    <h1>Nuestros Lugares Especiales 🌍</h1>
    <p>Estos son algunos de los sitios donde hemos creado recuerdos inolvidables.</p>

    <div id="mapa" style="height: 500px; margin: 30px 0; border-radius: 12px; box-shadow: 0 8px 20px rgba(0,0,0,0.2);"></div>

    <script>
      var map = L.map('mapa').setView([18.504694, -98.754111], 5); // Centro en CDMX, ajusta zoom

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
      }).addTo(map);

      // Agrega tus lugares aquí (lat, lng, nombre, descripción)
      const lugares = [
        { lat: 18.504694, lng: -98.754111, nombre: "Donde formalizamos nuestra relación", desc: "El lugar donde todo empezó" },
        { lat: 19.4847139, lng: -99.1178511, nombre: "La Basilica de Guadalupe", desc: "Nuestra primera visita a este lugar sagrado 🙏" },
        { lat: 18.506944, lng: -98.751722, nombre: "Tu lugar favorito", desc: "Tu segunda casa, tu lugar favorito" }
      ];

      lugares.forEach(lugar => {
        L.marker([lugar.lat, lugar.lng])
          .addTo(map)
          .bindPopup(`<b>${lugar.nombre}</b><br>${lugar.desc}`);
      });
    </script>
  </main>
